apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongodb.auth.secretName }}
type: Opaque
stringData:
  {{ .Values.mongodb.auth.usernameKey }}: {{ required "Set mongodb.auth.username in the selected values file or MONGO_USERNAME when using install.sh" .Values.mongodb.auth.username | quote }}
  {{ .Values.mongodb.auth.passwordKey }}: {{ required "Set mongodb.auth.password in the selected values file or MONGO_PASSWORD when using install.sh" .Values.mongodb.auth.password | quote }}